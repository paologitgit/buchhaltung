# Produktions-Setup: web (Django/Gunicorn) + db (PostgreSQL) + nginx (TLS-Terminierung).
# db ist bewusst NICHT nach aussen exponiert (kein "ports:"), nur im internen Netz erreichbar.
#
# Erststart mit HTTPS (Let's Encrypt):
#   1. In nginx/nginx.conf den Server-Block "listen 443" auskommentieren, Domain in
#      server_name eintragen, `docker compose up -d nginx web db` starten.
#   2. Zertifikat holen:
#      docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d DEINE-DOMAIN
#   3. 443-Block in nginx.conf wieder aktivieren, `docker compose restart nginx`.
#   4. Der certbot-Dienst erneuert das Zertifikat danach automatisch.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - backup_data:/app/backups
      - rclone_config:/home/appuser/.config/rclone
    networks:
      - internal

  # Läuft täglich ein Backup (Datenbank + Belege), siehe core/management/commands/backup.py.
  # Greift nur, solange dieser Container läuft -- für sporadischen lokalen
  # Gebrauch lieber den "Backup jetzt erstellen"-Button in der App nutzen.
  backup-cron:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - media_data:/app/media
      - backup_data:/app/backups
      - rclone_config:/home/appuser/.config/rclone
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do python manage.py backup; sleep 86400; done"]
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done;'"
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  media_data:
  static_data:
  backup_data:
  rclone_config:
  certbot_www:
  certbot_certs:
