{% extends "base.html" %}
{% block title %}Anmelden – Buchhaltung{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:3rem auto;">
  <h1>Anmelden</h1>
  {% if form.errors %}
  <p class="errorlist">Benutzername oder Passwort ist falsch.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Benutzername</label>
    <input type="text" name="username" id="id_username" required autofocus>
    <label for="id_password">Passwort</label>
    <input type="password" name="password" id="id_password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
