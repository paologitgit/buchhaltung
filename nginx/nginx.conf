# Vor dem ersten Start "deine-domain.example" durch die echte Domain ersetzen.
# Siehe docker-compose.yml für die Reihenfolge der Zertifikatsausstellung.

server {
    listen 80;
    server_name deine-domain.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name deine-domain.example;

    ssl_certificate     /etc/letsencrypt/live/deine-domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deine-domain.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Belege/Finanzdaten: max. Upload-Grösse etwas über dem Django-Limit (15 MB).
    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    # /media/ bewusst NICHT hier eingebunden: Belege werden ausschliesslich über
    # die login-geschützte Django-View (documents.views.beleg_download) ausgeliefert.

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
